map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Los archivos SIRE viajan por el WebSocket de Flet
    client_max_body_size 60m;

    # Copiar al portapapeles por http (ver portapapeles.js)
    location = /portapapeles.js {
        root /usr/share/nginx/sire;
    }

    location / {
        proxy_pass http://web:8550;
        # Sin compresión desde web, para que sub_filter pueda insertar el script en el HTML
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/portapapeles.js"></script></head>';
        sub_filter_once on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
